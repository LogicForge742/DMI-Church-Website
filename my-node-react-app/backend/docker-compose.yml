version: '3.8'

services:
  # NGINX Reverse Proxy and Load Balancer
  nginx:
    image: nginx:alpine
    ports:
      - "80:80" # Maps port 80 to the host
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: always

  # Node.js Backend API
  api:
    build:
      context: .
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_USER=postgres
      - DB_HOST=postgres
      - DB_NAME=dmi
      - DB_PASSWORD=JesusLives01
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-fallback_secret_for_local_dev}
      - CORS_ORIGIN=http://localhost
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/usr/src/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  # Background Queue Worker Process 
  # Note: Uses the same Docker image as 'api' but runs the worker entrypoint
  worker:
    build:
      context: .
    command: ["node", "src/worker.js"]
    environment:
      - NODE_ENV=production
      - DB_USER=postgres
      - DB_HOST=postgres
      - DB_NAME=dmi
      - DB_PASSWORD=JesusLives01
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MAILCHIMP_API_KEY=${MAILCHIMP_API_KEY:-}
      - MAILCHIMP_AUDIENCE_ID=${MAILCHIMP_AUDIENCE_ID:-}
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  # Primary Database
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=JesusLives01
      - POSTGRES_DB=dmi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # Redis for Caching & Queues
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  postgres_data:
  redis_data:
